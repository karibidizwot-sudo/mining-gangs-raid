</style></head><body><canvas aria-label="Трёхмерная локация дата-центра"></canvas><header><small>MINING GANGS / SECTOR 02</small><h1>DATA CENTER</h1><p>104,65 × 104,65 м · 9 зон</p></header><div id="status">ОСМОТР ЛОКАЦИИ</div><div class="toolbar"><div class="hint">Мышь — вращение · Колесо — масштаб<br>ПКМ — перемещение камеры · 1–4 — ракурсы</div><nav><button data-view="overview">Вся локация</button><button data-view="operations">Операторская</button><button data-view="power">Энергоблок</button><button data-view="cooling">Охлаждение</button><button data-view="servers">Серверная</button><button data-view="storage">Склад</button><button data-view="repair">Ремпост</button><button data-view="pipes">Трубы</button><button data-view="incident">Авария</button><button id="glass-walk" aria-pressed="false">Пройти по стеклу</button><button data-view="dispatch">Стол дежурного</button><button data-view="wreck">Разгром</button><button data-view="neon">Аварийный неон</button><button data-view="threshold">Шлюз КПП</button><button data-view="blackout">Обрыв линии</button><button id="score-toggle" aria-pressed="false">♫ Музыка</button><audio id="score" preload="none" loop src="./assets/last-feed.mp3"></audio><a href="/">Свалка</a></nav></div><div id="loading"><small>MINING GANGS</small><h1>DATA CENTER</h1><p id="progress">Подготовка помещения…</p><p id="failure"></p></div><script src="../../asset-manifest.js"></script><script src="app.js"></script><script>
