  <div id="loading" data-state="loading" aria-label="Загрузка Mining Gangs" aria-busy="true">
    <div class="loading-content">
      <h1 class="loading-brand">MINING <b>GANGS</b></h1>
      <div class="loading-meter" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="loading-fill"></span></div>
      <span class="loading-percent" aria-hidden="true">0%</span>
      <p class="loading-status" role="status" aria-live="polite">Загрузка…</p>
      <button class="loading-retry" hidden type="button" onclick="location.reload()">Попробовать снова</button>
    </div>

  <script>
    window.__reportGarageBoot=(reason,details={})=>{
      if(!['127.0.0.1','localhost'].includes(location.hostname))return;
      const data={reason:String(reason),stage:window.garageBootStage||'module',percent:document.querySelector('.loading-percent')?.textContent,...details};
      console.debug('Garage boot',data);
      if(!['ready','start','warmup'].includes(reason)){let out=document.getElementById('boot-error-detail');if(!out){out=document.createElement('p');out.id='boot-error-detail';out.style.cssText='font:12px monospace;color:#e6ba63;overflow-wrap:anywhere';document.querySelector('.loading-content').append(out);}out.textContent=data.reason+' / '+data.stage+' / '+data.percent;}
    };
    window.__reportGarageBoot('start');
    window.addEventListener('error',e=>window.__reportGarageBoot(e.message||'Resource failed',{file:e.filename||e.target?.src||'',line:e.lineno}));
    window.addEventListener('unhandledrejection',e=>window.__reportGarageBoot(e.reason?.message||String(e.reason)));
    // This fallback is already available if the main module cannot even load.
    (()=>{
      const fail=()=>{const screen=document.getElementById('loading');if(screen.hidden||screen.dataset.state==='ready')return;dispose();screen.dataset.state='error';screen.setAttribute('aria-busy','false');screen.querySelector('.loading-status').textContent='Не удалось загрузить игру. Попробуйте ещё раз.';screen.querySelector('.loading-retry').hidden=false;};
      const error=event=>{if(event.target===window||event.target?.tagName==='SCRIPT')fail();};
      const timer=setTimeout(fail,180000);
      window.addEventListener('error',error,true);window.addEventListener('unhandledrejection',fail);
      const dispose=()=>{clearTimeout(timer);window.removeEventListener('error',error,true);window.removeEventListener('unhandledrejection',fail);window.removeEventListener('pagehide',dispose);delete window.__garageBootFallback;};
      window.addEventListener('pagehide',dispose);window.__garageBootFallback={dispose};
    })();
  </script>
